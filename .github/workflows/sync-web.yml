name: Sync Web to Deploy Repo

on:
  push:
    branches: [main]
    paths: ['apps/web/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Setup sedim-web repo
        run: |
          git init web
          cd web
          git config user.email "bot@sedim.io"
          git config user.name "Sedim Bot"
          git remote add origin https://x-access-token:${{ secrets.SEDIM_WEB_PAT }}@github.com/Sedimie/sedim-web.git

      - name: Sync and push
        run: |
          cp -r monorepo/apps/web/. web/
          cd web
          git add .
          git commit -m "chore: sync from monorepo" || echo "Nothing to commit"
          git push -f origin HEAD:main
