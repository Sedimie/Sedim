name: Sync Web to Deploy Repo

on:
  push:
    branches: [main]
    paths: ['apps/web/**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          path: monorepo

      - name: Setup sedim-web repo
        run: |
          mkdir -p web
          cd web
          git init
          git remote add origin https://x-access-token:${{ secrets.SEDIM_WEB_PAT }}@github.com/Sedimie/sedim-web.git
          git fetch origin
          if git rev-parse --verify --quiet origin/main; then
            git checkout -b main origin/main
          else
            git checkout --orphan main
            git reset --hard
          fi

      - name: Sync apps/web to sedim-web
        run: cp -r monorepo/apps/web/. web/

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync from monorepo"
          file_pattern: "*"
          repository_path: web
          commit_user_name: Sedim Bot
          commit_user_email: bot@sedim.io
